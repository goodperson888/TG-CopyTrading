name: Windows portable build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Test
        run: npm test
      - name: Check syntax
        run: npm run check
      - name: Build public portable package
        run: npm run build:win
      - name: Extract and run on Windows
        run: npm run verify:win
      - name: Upload public package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TGCopyTrading-Windows-x64
          path: |
            dist/TGCopyTrading-Windows-x64.zip
            dist/TGCopyTrading-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
